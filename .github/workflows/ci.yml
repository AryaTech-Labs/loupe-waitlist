name: CI

# Every push and PR: static checks, unit tests, and the phone browser tests.
# Pushes to main then publish src/ to GitHub Pages, only if all of that passed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Static checks (anon key only, CSP, no beta date)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Install browsers
        run: npx playwright install --with-deps webkit chromium
      - name: Browser tests (iPhone + Android)
        run: npm run test:e2e
      # What ships is the version-stamped copy (deploy job): test that too,
      # before it's published rather than only by the Live check after.
      - name: Browser tests on the version-stamped copy
        run: |
          cp -r src "$RUNNER_TEMP/stamped"
          node scripts/stamp-version.mjs "$RUNNER_TEMP/stamped" "${GITHUB_SHA::12}"
          SITE_ROOT="$RUNNER_TEMP/stamped" npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # Each deploy's scripts and stylesheet load only alongside each other,
      # whatever a browser still has cached from the last one.
      - name: Stamp this deploy's version on the page's scripts and styles
        run: node scripts/stamp-version.mjs src "${GITHUB_SHA::12}"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  live:
    name: Live check
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      # The same phone tests, against what Pages is now serving. Supabase is
      # answered in the browser, so this never writes to the waitlist.
      - name: Browser tests against the live site
        run: npm run test:e2e
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-traces
          path: test-results/
          retention-days: 7
