name: CI

# Every push and PR: static checks, unit tests, and the phone browser tests.
# Pushes to main then publish src/ to GitHub Pages, only if all of that passed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Static checks (anon key only, CSP, no beta date)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Install browsers
        run: npx playwright install --with-deps webkit chromium
      - name: Browser tests (iPhone + Android)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Each deploy's scripts and stylesheet load only alongside each other,
      # whatever a browser still has cached from the last one.
      - name: Stamp this deploy's version on the page's scripts and styles
        run: node scripts/stamp-version.mjs src "${GITHUB_SHA::12}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4

  live:
    name: Live check
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      # The same phone tests, against what Pages is now serving. Supabase is
      # answered in the browser, so this never writes to the waitlist.
      - name: Browser tests against the live site
        run: npm run test:e2e
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-traces
          path: test-results/
          retention-days: 7
