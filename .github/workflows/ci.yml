name: CI

# Every push and PR: static checks, unit tests, and the phone browser tests.
# Pushes to main then publish src/ to GitHub Pages, only if all of that passed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Static checks (anon key only, CSP, no beta date)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Install browsers
        run: npx playwright install --with-deps webkit chromium
      - name: Browser tests (iPhone + Android)
        run: npm run test:e2e
      # What ships is the version-stamped copy (deploy job): test that too,
      # before it's published rather than only by the Live check after.
      - name: Browser tests on the version-stamped copy
        run: |
          cp -r src "$RUNNER_TEMP/stamped"
          node scripts/stamp-version.mjs "$RUNNER_TEMP/stamped" "${GITHUB_SHA::12}"
          SITE_ROOT="$RUNNER_TEMP/stamped" npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Each deploy's scripts and stylesheet load only alongside each other,
      # whatever a browser still has cached from the last one.
      - name: Stamp this deploy's version on the page's scripts and styles
        run: node scripts/stamp-version.mjs src "${GITHUB_SHA::12}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  live:
    name: Live check
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      # The same phone tests, against what Pages is now serving. Supabase is
      # answered in the browser, so this never writes to the waitlist.
      - name: Browser tests against the live site
        run: npm run test:e2e
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-traces
          path: test-results/
          retention-days: 7
