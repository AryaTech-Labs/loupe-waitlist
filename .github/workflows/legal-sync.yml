name: Legal pages in sync

# loupeweb.com/privacy, /terms and /community-guidelines are imported from the
# app's published pages (scripts/import-legal.mjs). Weekly, and on demand, this
# fails if the source has changed, so someone re-runs the import.

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Legal pages match the source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/import-legal.mjs --check
